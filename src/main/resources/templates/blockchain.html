<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blockchain Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Blockchain Explorer</h2>
        <a href="/admin" class="btn btn-outline-secondary">Admin Dashboard</a>
    </div>
    <div class="alert" th:classappend="${blockchainValid} ? ' alert-success' : ' alert-danger'"
         th:text="${blockchainValid} ? 'Blockchain integrity verified' : 'Blockchain integrity check failed'">
        Blockchain integrity status
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
            <tr>
                <th>Block</th>
                <th>Timestamp</th>
                <th>Certificate ID</th>
                <th>Certificate Hash</th>
                <th>Previous Hash</th>
                <th>Current Hash</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(blocks)}">
                <td colspan="6" class="text-center">No blockchain records found.</td>
            </tr>
            <tr th:each="block : ${blocks}">
                <td th:text="${block.blockIndex}">0</td>
                <td th:text="${block.timestamp}">timestamp</td>
                <td th:text="${block.certificateId}">certificate ID</td>
                <td class="text-break" th:text="${block.certificateHash}">certificate hash</td>
                <td class="text-break" th:text="${block.previousHash}">previous hash</td>
                <td class="text-break" th:text="${block.currentHash}">current hash</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
