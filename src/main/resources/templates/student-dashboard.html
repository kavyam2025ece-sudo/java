<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Student Dashboard</h2>

    <div th:if="${uploadSuccess != null}" class="alert alert-success" th:text="${uploadSuccess}"></div>
    <div th:if="${uploadError != null}" class="alert alert-danger" th:text="${uploadError}"></div>

    <div class="card p-4">
        <h4>Student Profile</h4>
        <p><strong>Name:</strong> <span th:text="${studentName}">Student Name</span></p>
        <p><strong>Username:</strong> <span th:text="${username}">student</span></p>
        <p><strong>Register Number:</strong> <span th:text="${studentRegisterNumber}">N/A</span></p>
        <p><strong>Course:</strong> <span th:text="${studentCourse}">N/A</span></p>
        <p><strong>Department:</strong> <span th:text="${studentDepartment}">N/A</span></p>
        <p><strong>Email:</strong> <span th:text="${studentEmail}">student@example.com</span></p>
    </div>

    <div class="card mt-4 p-4">
        <h4>Upload Certificate</h4>
        <form th:action="@{/student-dashboard/upload}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <input class="form-control" type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required>
            </div>
            <button class="btn btn-primary" type="submit">Upload Certificate</button>
        </form>
    </div>

    <div class="mt-4">
        <h4>Certificates</h4>
        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <th>Certificate ID</th>
                <th>Course</th>
                <th>Type</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(certificates)}">
                <td colspan="5" class="text-center">No certificates yet.</td>
            </tr>
            <tr th:each="certificate : ${certificates}">
                <td th:text="${certificate.certificateId}">CERT-0001</td>
                <td th:text="${certificate.courseName}">Course</td>
                <td th:text="${certificate.certificateType}">Type</td>
                <td>
                    <span class="badge" th:classappend="${certificate.status == 'VALID'} ? 'bg-success' : 'bg-warning text-dark'"
                          th:text="${certificate.status}">VALID</span>
                </td>
                <td>
                    <a class="btn btn-sm btn-primary" th:href="@{'/api/verify/' + ${certificate.certificateId}}">Verify</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a href="/logout" class="btn btn-outline-danger">Logout</a>
    </div>
</div>
</body>
</html>
