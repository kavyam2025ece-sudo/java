<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Issued Certificates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="mb-0">Issued Certificates</h2>
        <div class="d-flex gap-2">
            <a href="/issue-certificate" class="btn btn-primary">Issue Certificate</a>
            <a href="/admin" class="btn btn-outline-secondary">Admin Dashboard</a>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
            <tr>
                <th>Certificate ID</th>
                <th>Student ID</th>
                <th>Course</th>
                <th>Type</th>
                <th>Issue Date</th>
                <th>Status</th>
                <th>Block</th>
                <th>Verification</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(certificates)}">
                <td colspan="8" class="text-center">No certificates have been issued.</td>
            </tr>
            <tr th:each="certificate : ${certificates}">
                <td th:text="${certificate.certificateId}">CERT-0001</td>
                <td th:text="${certificate.studentId}">1</td>
                <td th:text="${certificate.courseName}">Course</td>
                <td th:text="${certificate.certificateType}">Type</td>
                <td th:text="${certificate.issueDate}">2026-01-01</td>
                <td>
                    <span class="badge" th:classappend="${certificate.status == 'VALID'} ? ' bg-success' : ' bg-danger'"
                          th:text="${certificate.status}">VALID</span>
                </td>
                <td th:text="${certificate.blockIndex != null ? certificate.blockIndex : 'Pending'}">1</td>
                <td><a th:href="@{'/verify/' + ${certificate.certificateId}}">View verification</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
