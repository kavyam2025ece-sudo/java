<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">Create Account</h3>
                    <form method="post" action="/register">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="fullName" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Select Role</label>
                            <select class="form-select" name="role" required>
                                <option value="ADMIN">Admin</option>
                                <option value="STUDENT">Student</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="registerPassword" name="password" required>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="showRegisterPassword">
                            <label class="form-check-label" for="showRegisterPassword">Show Password</label>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Create Account</button>
                    </form>

                    <div class="mt-3 text-center">
                        <a href="/login">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('showRegisterPassword').addEventListener('change', function () {
        const passwordField = document.getElementById('registerPassword');
        passwordField.type = this.checked ? 'text' : 'password';
    });
</script>
</body>
</html>
