<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="mb-4" th:text="${student.id == null ? 'Add Student' : 'Edit Student'}">Add Student</h2>
                    <form method="post" action="/admin/students/save" th:object="${student}">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerNumber" class="form-label">Register Number</label>
                            <input id="registerNumber" type="text" class="form-control" th:field="*{registerNumber}" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email" class="form-control" th:field="*{email}" required>
                        </div>
                        <div class="mb-3">
                            <label for="department" class="form-label">Department</label>
                            <input id="department" type="text" class="form-control" th:field="*{department}" required>
                        </div>
                        <div class="mb-3">
                            <label for="course" class="form-label">Course</label>
                            <input id="course" type="text" class="form-control" th:field="*{course}" required>
                        </div>
                        <div class="mb-4">
                            <label for="graduationYear" class="form-label">Graduation Year</label>
                            <input id="graduationYear" type="number" class="form-control" th:field="*{graduationYear}" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Student</button>
                            <a href="/admin/students" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
