<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue Certificate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="mb-4">Issue Certificate</h3>
                    <form method="post" action="/api/certificates/issue">
                        <div class="mb-3">
                            <label class="form-label">Student ID</label>
                            <input type="number" class="form-control" name="studentId" placeholder="Enter student ID" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Course Name</label>
                            <input type="text" class="form-control" name="courseName" placeholder="e.g. Computer Science" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Certificate Type</label>
                            <input type="text" class="form-control" name="certificateType" placeholder="e.g. Degree, Diploma" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Issue Date</label>
                            <input type="date" class="form-control" name="issueDate" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Issue Certificate</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
