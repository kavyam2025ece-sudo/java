<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Admin Dashboard</h2>
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <h5>Total Students</h5>
                    <h3>0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-success">
                <div class="card-body">
                    <h5>Total Certificates</h5>
                    <h3>0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-warning">
                <div class="card-body">
                    <h5>Verified Certificates</h5>
                    <h3>0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-info">
                <div class="card-body">
                    <h5>Recent Certificates</h5>
                    <h3>0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex flex-wrap gap-2">
        <a href="/admin/students" class="btn btn-primary">View Students</a>
        <a href="/admin/students/add" class="btn btn-success">Add Student</a>
        <a href="/issue-certificate" class="btn btn-warning">Issue Certificate</a>
        <a href="/api/certificates" class="btn btn-info">View Certificates</a>
        <a href="/verify-certificate" class="btn btn-secondary">Verify Certificate</a>
        <a href="/api/blockchain" class="btn btn-dark">View Blockchain</a>
    </div>
</div>
</body>
</html>
