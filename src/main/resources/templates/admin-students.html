<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Students</h2>
        <div class="d-flex gap-2">
            <a href="/admin/students/add" class="btn btn-success">Add Student</a>
            <a href="/admin" class="btn btn-outline-secondary">Admin Dashboard</a>
        </div>
    </div>

    <form method="get" action="/admin/students/search" class="input-group mb-4">
        <input type="text" name="keyword" class="form-control" placeholder="Search students" required>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div class="card shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(students)}" class="alert alert-info mb-0">No students found.</div>
            <div th:unless="${#lists.isEmpty(students)}" class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Register Number</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.name}">Student</td>
                        <td th:text="${student.registerNumber}">REG-001</td>
                        <td th:text="${student.email}">student@example.com</td>
                        <td th:text="${student.department}">Engineering</td>
                        <td th:text="${student.course}">Computer Science</td>
                        <td class="text-nowrap">
                            <a th:href="@{'/admin/students/edit/' + ${student.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a th:href="@{'/admin/students/delete/' + ${student.id}}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
